name: PS5 Build and Release

# The homebrew catalog's versioning rules (docs/versioning.md in
# darkxex/ps5-homebrew-catalog): contentVersion in sce_sys/param.json is
# NN.NNN.NNN, rises with every release, and the release tag is that value.
# crawl-ref/source/ps5/content-version.py enforces them.
#
# - Every push and pull request: build both, kept as CI artifacts.
# - Run it by hand on ps5 with "release" set to patch, minor or major:
#   raise contentVersion, build the title from that, then commit the bump, tag
#   it with the new version and publish the release, in that order, so a
#   failed build leaves nothing behind. "current" releases the committed
#   contentVersion as it is (after raising it by hand).
# - A version tag pushed by hand, equal to contentVersion: publish its release.
on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      release:
        description: Publish a native release, raising contentVersion by this part
        type: choice
        options: [none, patch, minor, major, current]
        default: none
      notes:
        description: Release notes (Markdown; short headings and bullet lists). Empty lists the commits since the last release.
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  # The ELF payload (PS5=y), for loaders such as elfldr. Not a catalog
  # artifact: the homebrew catalog lists native titles only.
  payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build environment
        # clang/lld run the prospero-clang wrappers; libpng-dev is for
        # tilegen, which runs on the runner to generate the tile images.
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang-18 \
            git \
            libpng-dev \
            lld-18 \
            perl \
            pkg-config \
            python3 \
            python3-yaml \
            zip

      - name: Install prebuilt PS5 payload SDK
        # The pacbrew-repo release bundles the SDK with every pacbrew
        # library (SDL2, SDL2_image, Lua, SQLite, freetype, libpng, ...)
        # already built and installed under /opt/ps5-payload-sdk.
        env:
          GH_TOKEN: ${{ github.token }}
          PACBREW_VERSION: v0.41.1
        run: |
          gh release download "$PACBREW_VERSION" \
            --repo ps5-payload-dev/pacbrew-repo \
            --pattern ps5-payload-dev.tar.gz --dir "$RUNNER_TEMP"
          sudo tar -xzf "$RUNNER_TEMP/ps5-payload-dev.tar.gz" -C /
          rm "$RUNNER_TEMP/ps5-payload-dev.tar.gz"

      - name: Checkout fonts submodule
        # Only the fonts; every library comes from the pacbrew packages.
        run: git submodule update --init --depth 1 crawl-ref/source/contrib/fonts

      - name: Build
        working-directory: crawl-ref/source
        run: |
          make -j4 PS5=y install DESTDIR="$RUNNER_TEMP/stage"
          echo "CRAWL_VERSION=$(git describe)" >> "$GITHUB_ENV"

      - name: Package
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/stage/data/crawl/bin/crawl" dist/crawl-ps5.elf
          (cd "$RUNNER_TEMP/stage" && zip -qr "$GITHUB_WORKSPACE/dist/crawl-ps5-payload.zip" .)
          (cd dist && sha256sum crawl-ps5.elf crawl-ps5-payload.zip | tee SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-ps5-payload-${{ env.CRAWL_VERSION }}
          path: dist/

  # The native title (PS5_NATIVE=y): <TITLEID>.zip with eboot.bin, sce_sys/,
  # sce_module/ and assets/, the file the homebrew catalog installs. Built by
  # crawl-ref/source/ps5/build_ps5.py, which pins everything it builds with.
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release on a version tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout fonts submodule
        # Every library is a PS5 build: PacBrew's, ps5/sdl2's SDL2 and the
        # platform layer. Only the fonts come from contrib.
        run: git submodule update --init --depth 1 crawl-ref/source/contrib/fonts

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang-18 cmake curl git libclang-rt-18-dev \
            libpng-dev lld-18 llvm-18 ninja-build perl pkg-config python3 \
            python3-yaml tar unzip zip

      - name: Choose the version
        # sce_sys/param.json is the committed copy the catalog reads; the
        # build uses the same title ID and content version.
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'none' }}
        run: |
          cv="python3 crawl-ref/source/ps5/content-version.py"
          echo "TITLE_ID=$(python3 -c 'import json; print(json.load(open("sce_sys/param.json"))["titleId"])')" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]]; then
            version=$($cv current)
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "::error::tag $GITHUB_REF_NAME does not match contentVersion $version in sce_sys/param.json"
              exit 1
            }
            $cv check "$version"
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
          elif [[ "$RELEASE" != none ]]; then
            [[ "$GITHUB_REF" == refs/heads/ps5 ]] || {
              echo "::error::release from the ps5 branch, not $GITHUB_REF"
              exit 1
            }
            version=$($cv bump "$RELEASE")
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
            echo "::notice::releasing contentVersion $version"
          else
            version=$($cv current)
          fi
          echo "CONTENT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache the dependencies
        # ps5/.deps: build_ps5.py deps redoes any piece whose pin changed.
        uses: actions/cache@v4
        with:
          path: crawl-ref/source/ps5/.deps
          key: ps5-deps-${{ hashFiles('crawl-ref/source/ps5/build_ps5.py', 'crawl-ref/source/ps5/sdl2/**', 'crawl-ref/source/ps5/tooling/native/**') }}
          restore-keys: ps5-deps-

      - name: Fetch and build the dependencies
        working-directory: crawl-ref/source
        run: python3 ps5/build_ps5.py deps

      - name: Build and package the title
        working-directory: crawl-ref/source
        run: |
          python3 ps5/build_ps5.py build
          python3 ps5/build_ps5.py package
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "ps5/dist/$TITLE_ID.zip" "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "$TITLE_ID.zip" | tee SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TITLE_ID }}-${{ env.CONTENT_VERSION }}
          path: dist/

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        env:
          NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        # The catalog shows these as the app's release notes: what changed
        # first, short headings and bullet lists, no images or links. The
        # commits are ps5's own (first parent), not merged upstream ones.
        run: |
          previous=$(git tag --list '[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]' --sort=-v:refname \
            | grep -vx "$RELEASE_TAG" | head -n 1 || true)
          {
            if [[ -n "$NOTES" ]]; then
              printf '%s\n' "$NOTES"
            elif [[ -n "$previous" ]]; then
              echo "## Changes since $previous"
              echo
              git log --first-parent --no-merges --format='- %s' "$previous..HEAD"
            else
              echo "## First release"
              echo
              echo "- Dungeon Crawl Stone Soup, built as a native PS5 title ($TITLE_ID)."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Commit and tag the new version
        if: env.RELEASE_TAG != '' && github.ref_type != 'tag'
        # Pushes made with the workflow's token start no other workflow, so
        # this doesn't rebuild itself.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sce_sys/param.json; then
            git commit -q -m "PS5 native: contentVersion $RELEASE_TAG" -- sce_sys/param.json
          fi
          git tag -a "$RELEASE_TAG" -m "Dungeon Crawl Stone Soup for PS5 $RELEASE_TAG"
          # Atomic: if ps5 moved during the build, neither the bump nor
          # the tag lands, and nothing is released.
          git push --atomic origin "HEAD:refs/heads/ps5" "refs/tags/$RELEASE_TAG"

      - name: Publish release
        # A normal release with the title zip as its only asset. The catalog
        # accepts pre-releases too, but those never count as the repository's
        # latest release. An existing release is never changed: a listed
        # asset's sha256 must not change.
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::release $RELEASE_TAG already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "dist/$TITLE_ID.zip" \
            --verify-tag \
            --title "Dungeon Crawl Stone Soup for PS5 $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
